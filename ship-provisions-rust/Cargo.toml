[package]
name = "ship-provisions"
version = "1.0.0"
edition = "2021"
description = "Ship provisions inventory tracker (Windows desktop app)"

[lib]
name = "ship_provisions"
path = "src/lib.rs"

[[bin]]
name = "ShipProvisions"
path = "src/main.rs"

[dependencies]
anyhow = "1"
calamine = "0.38"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1.4"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }
lopdf = "0.47.0"
pdf-extract = "0.12"
regex = "1.13"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
rusqlite = { version = "0.42", features = ["bundled"] }
rust_xlsxwriter = "0.102"

[profile.release]
opt-level = 2
lto = true
